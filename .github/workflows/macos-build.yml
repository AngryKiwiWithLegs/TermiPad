name: macOS Xcode Build

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner image
        default: macos-14

permissions:
  contents: read

jobs:
  build:
    name: Probe on ${{ inputs.runner }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        shell: bash
        run: |
          echo "::notice title=toolchain::$(xcodebuild -version | tr '\n' ' ') | $(swift --version 2>&1 | head -1)"
      - name: Unit tests
        id: tests
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          swift test 2>&1 | tee swift-test.log
      - name: Report
        if: always()
        shell: bash
        run: |
          echo "::notice title=outcome::swift test outcome=${{ steps.tests.outcome }} lines=$(wc -l < swift-test.log)"
          grep -E 'error:|fatal error:|failed|Executed [0-9]+ tests' swift-test.log | sed -E "s#$PWD/##g" | awk '!seen[$0]++' > picked.txt || true
          echo "::notice title=picked::$(wc -l < picked.txt) lines"
          split -l 12 -d picked.txt chunk_ || true
          n=0
          for f in chunk_*; do
            [ -f "$f" ] || continue
            n=$((n+1)); [ $n -gt 9 ] && break
            msg=$(cut -c1-330 "$f" | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')
            echo "::warning title=log-$n::$msg"
          done
          msg=$(tail -n 12 swift-test.log | cut -c1-300 | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')
          echo "::notice title=tail::$msg"
