name: macOS Xcode Build

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner image
        default: macos-14

permissions:
  contents: read

jobs:
  build:
    name: Probe on ${{ inputs.runner }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        shell: bash
        run: |
          echo "::notice title=toolchain::$(xcodebuild -version | tr '\n' ' ') | $(swift --version 2>&1 | head -1)"
      - name: Xcode builds
        shell: bash
        run: |
          set +e +o pipefail
          brew install xcodegen >/dev/null 2>&1
          xcodegen generate > xcodegen.log 2>&1; echo "::notice title=xcodegen::exit $? $(tail -n 2 xcodegen.log | tr '\n' ' ')"
          for spec in "TermiPad|platform=macOS" "TermiPadCompanion|generic/platform=iOS Simulator" "TermiPadUITests|platform=macOS"; do
            t="${spec%%|*}"; d="${spec##*|}"
            xcodebuild -project TermiPad.xcodeproj -target "$t" -configuration Debug CODE_SIGNING_ALLOWED=NO SYMROOT="$RUNNER_TEMP/b-$t" $( [ "$t" = TermiPadCompanion ] && echo "-sdk iphonesimulator" ) build > "xb-$t.log" 2>&1
            rc=$?
            errs=$(grep -E '(error|fatal error):' "xb-$t.log" | sed -E "s#$PWD/##g" | awk '!seen[$0]++' | head -12 | cut -c1-300 | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')
            tailmsg=$(tail -n 6 "xb-$t.log" | cut -c1-250 | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')
            echo "::notice title=xcodebuild-$t::exit $rc | $(grep -E 'BUILD (SUCCEEDED|FAILED)' "xb-$t.log" | tail -1)%0A$errs%0A--tail--%0A$tailmsg"
          done
