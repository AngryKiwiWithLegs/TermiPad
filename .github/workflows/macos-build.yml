name: macOS Xcode Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# A new commit cancels any unfinished older build on the same branch, to avoid wasting macOS build time.
concurrency:
  group: macos-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build TermiPad on macOS
    # TermiPad's minimum supported version is macOS 14; this stable image avoids the infrastructure flakiness of the macOS 15 pre-release runners.
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Record toolchain information
        shell: bash
        run: |
          mkdir -p ci-logs
          {
            echo "Commit: $GITHUB_SHA"
            echo "Runner: $RUNNER_OS / $RUNNER_ARCH"
            echo
            echo "=== Xcode ==="
            xcodebuild -version
            echo
            echo "=== Swift ==="
            swift --version
          } | tee ci-logs/toolchain.txt

      - name: Validate Swift package manifest
        shell: bash
        run: |
          set -o pipefail
          swift package dump-package | tee ci-logs/package-manifest.json

      - name: Run core logic unit tests
        shell: bash
        run: |
          set -o pipefail
          swift test 2>&1 | tee ci-logs/swift-test.log

      - name: Install Xcode project generator
        shell: bash
        run: brew install xcodegen

      - name: Generate macOS Xcode project
        shell: bash
        run: |
          set -o pipefail
          xcodegen generate 2>&1 | tee ci-logs/xcodegen.log

      - name: Build with xcodebuild
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project TermiPad.xcodeproj \
            -scheme TermiPad \
            -destination "platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/TermiPadDerivedData" \
            clean build 2>&1 | tee ci-logs/xcodebuild.log

      - name: Run macOS UI smoke test and capture interface evidence
        shell: bash
        run: |
          set -o pipefail
          DERIVED_DATA="$RUNNER_TEMP/TermiPadUITestDerivedData"
          RESULT_BUNDLE="ci-logs/TermiPadUITests.xcresult"
          set +e
          xcodebuild \
            -project TermiPad.xcodeproj \
            -scheme TermiPad \
            -destination "platform=macOS" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RESULT_BUNDLE" \
            test 2>&1 | tee ci-logs/xcode-ui-test.log
          TEST_STATUS=${PIPESTATUS[0]}
          set -e

          mkdir -p ci-logs/ui-attachments
          if [ -d "$RESULT_BUNDLE" ]; then
            xcrun xcresulttool export attachments \
              --path "$RESULT_BUNDLE" \
              --output-path ci-logs/ui-attachments || true
          fi

          exit "$TEST_STATUS"

      - name: Extract actionable diagnostics
        if: always()
        shell: bash
        run: |
          {
            echo "# TermiPad macOS build diagnostics"
            echo
            echo "## Error and warning lines"
            echo '```text'
            if [ -f ci-logs/xcodebuild.log ]; then
              grep -E -i '(^|[[:space:]])(error|warning|fatal error):|BUILD FAILED|SwiftCompile|CompileSwift' ci-logs/xcodebuild.log || true
            else
              echo "xcodebuild did not create a build log file. See the workflow step output."
            fi
            if [ -f ci-logs/xcode-ui-test.log ]; then
              grep -E -i '(^|[[:space:]])(error|warning|fatal error):|TEST FAILED|Test Case|Assertion' ci-logs/xcode-ui-test.log || true
            else
              echo "UI-test log was not created."
            fi
            echo
            echo "## Unit-test summary"
            echo '```text'
            if [ -f ci-logs/swift-test.log ]; then
              grep -E 'Test Suite|Test Case|Executed|error:|fatal error:' ci-logs/swift-test.log || true
            else
              echo "Unit-test log was not created."
            fi
            echo '```'
            echo
            echo "## UI acceptance artifacts"
            if [ -d ci-logs/ui-attachments ] && [ "$(find ci-logs/ui-attachments -type f | wc -l)" -gt 0 ]; then
              echo "UI test screenshot attachments were exported; download them from this build's artifacts."
            else
              echo "No screenshot attachments were exported; check the UI test log and the .xcresult bundle."
            fi
          } | tee ci-logs/diagnostic-summary.md

          cat ci-logs/diagnostic-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: termipad-macos-build-${{ github.run_id }}
          path: ci-logs/
          if-no-files-found: warn
          retention-days: 14
