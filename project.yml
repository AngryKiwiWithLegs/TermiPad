name: TermiPad
options:
  minimumXcodeGenVersion: 2.39.0
  xcodeVersion: "26.0"
  deploymentTarget:
    macOS: "14.0"
attributes:
  LastUpgradeCheck: "2600"
  LastSwiftUpdateCheck: "2600"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    ENABLE_HARDENED_RUNTIME: "NO"
    DEAD_CODE_STRIPPING: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    STRING_CATALOG_GENERATE_SYMBOLS: "YES"
    ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: "YES"
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "YES"
targets:
  TermiPad:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.termipad.app
        PRODUCT_NAME: TermiPad
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: TermiPad
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "TermiPad 需要控制您选择的终端，以打开并执行您确认的命令。"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        DEAD_CODE_STRIPPING: "YES"
    scheme:
      testTargets:
        - TermiPadTests
        - TermiPadUITests

  TermiPadTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/TermiPadTests
    dependencies:
      - target: TermiPad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.termipad.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TermiPad.app/Contents/MacOS/TermiPad"
        BUNDLE_LOADER: "$(TEST_HOST)"
        DEAD_CODE_STRIPPING: "YES"

  TermiPadUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests/TermiPadUITests
    dependencies:
      - target: TermiPad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.termipad.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: TermiPad
        DEAD_CODE_STRIPPING: "YES"
