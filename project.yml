name: TermiPad
options:
  minimumXcodeGenVersion: 2.39.0
  xcodeVersion: "26.0"
  deploymentTarget:
    macOS: "14.0"
attributes:
  LastUpgradeCheck: "2600"
  LastSwiftUpdateCheck: "2600"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # The UI test Runner must use at least an ad hoc signature, otherwise the local Gatekeeper may block it from launching.
    # "-" needs no developer certificate or Apple Developer team; it is only for local builds and tests.
    CODE_SIGNING_ALLOWED: "YES"
    CODE_SIGNING_REQUIRED: "YES"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: "NO"
    DEAD_CODE_STRIPPING: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    STRING_CATALOG_GENERATE_SYMBOLS: "YES"
    ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: "YES"
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "YES"
targets:
  TermiPad:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.termipad.app
        PRODUCT_NAME: TermiPad
        # M4 fixed signing (2026-09-18): the ad hoc signature changes on every build, and the keychain item's
        # ACL is bound to the old signature → repeated authorization prompts after every rebuild. Switch to the Apple Development
        # certificate (the same one as the iOS Companion) → a stable signature, authorized once and valid for good.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: 7LTPLQKWWD
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: TermiPad
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "TermiPad needs to control the terminal you choose in order to open it and run the commands you confirm."
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        DEAD_CODE_STRIPPING: "YES"
    scheme:
      testTargets:
        - TermiPadTests
        - TermiPadUITests

  TermiPadTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/TermiPadTests
    dependencies:
      - target: TermiPad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.termipad.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TermiPad.app/Contents/MacOS/TermiPad"
        BUNDLE_LOADER: "$(TEST_HOST)"
        DEAD_CODE_STRIPPING: "YES"

  TermiPadUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests/TermiPadUITests
    dependencies:
      - target: TermiPad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.termipad.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: TermiPad
        DEAD_CODE_STRIPPING: "YES"

  TermiPadCompanion:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: CompanionApp
      # App icon (M5: iPhone-native style assets)
      - path: CompanionApp/Assets.xcassets
      # Reuse the Mac's pure logic layer (cryptography / protocol / framing / Keychain) to avoid code drift
      - path: Sources/MobilePairingCrypto.swift
      - path: Sources/MobilePairingProtocol.swift
      - path: Sources/KeychainStore.swift
    info:
      path: CompanionApp/Info.plist
      properties:
        CFBundleDisplayName: TermiPad Companion
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Required for local discovery on iOS 14+: without NSLocalNetworkUsageDescription or
        # NSBonjourServices the system silently blocks Bonjour — verify-macos.sh has a guard
        NSLocalNetworkUsageDescription: TermiPad Companion discovers and pairs with your Mac only on the same Wi-Fi local network; it never connects to the public internet.
        NSBonjourServices:
          - _termipad-m1._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.termipad.companion
        PRODUCT_NAME: TermiPadCompanion
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        # Free personal team (Apple rotated the team ID after signing in again: 4XRX3DHYQ6 → 7LTPLQKWWD)
        DEVELOPMENT_TEAM: "7LTPLQKWWD"
